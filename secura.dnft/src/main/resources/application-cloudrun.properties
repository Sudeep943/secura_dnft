spring.application.name=secura.dnft

server.port=${SERVER_PORT:8080}


spring.datasource.url=${NEON_DNFT_DB_URL}
spring.datasource.username=${NEON_DNFT_DB_USERNAME}
spring.datasource.password=${NEON_DNFT_DB_PASSWORD}
spring.datasource.driver-class-name=${NEON_DNFT_DB_DRIVER_NAME}


spring.jpa.database-platform=${NEON_DNFT_DB_PLATFORM}
spring.jpa.hibernate.ddl-auto=${NEON_DNFT_DDL_AUTO_UPDATE}
spring.jpa.show-sql=${NEON_DNFT_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${NEON_DNFT_FORMAT_SQL:false}

privacy.secrect.key=${ENCRYPTION_SECRET_KEY}
privacy.secrect.algo=${ENCRYPTION_SECRET_ALGO}

auth.crypto.key-base64=${ENCRYPTION_CRYPTO_KEY}
auth.crypto.iv-base64=${ENCRYPTION_CRYPTO_IV}
auth.crypto.transformation=${ENCRYPTION_CRYPTO_TRANSFORM}

spring.jackson.time-zone=${TIME_ZONE}
face.recognition.service.url=${FACE_RECOGNITION_SERVICE_URL:}

attendance.face.match.threshold=0.10
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USER_NAME}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=${EMAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_STARTTLS}
spring.mail.properties.mail.smtp.timeout=${EMAIL_TIME_OUT}
spring.mail.properties.mail.smtp.connectiontimeout=${EMAIL_CONNECTION_TIME_OUTS}
email.log.retention.days=${EMAIL_RETENTION_DAYS}
app.payment.url=${PAYMENT_URL}


transaction.chunk=${TRANSACTION_CHUNK}
